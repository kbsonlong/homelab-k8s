services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
    init: true
    ports:
      - "2586:80"
    volumes:
      - /data/ntfy/cache:/var/cache/ntfy
      - /data/ntfy/etc:/etc/ntfy
    environment:
      - TZ=Asia/Shanghai
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
