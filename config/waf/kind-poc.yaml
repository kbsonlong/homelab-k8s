apiVersion: v1
kind: Namespace
metadata:
  name: waf
  labels:
    app.kubernetes.io/part-of: gateway-waf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crs-grafana
  namespace: waf
  labels: {app.kubernetes.io/name: crs-grafana, app.kubernetes.io/part-of: gateway-waf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: crs-grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crs-grafana, app.kubernetes.io/part-of: gateway-waf}
    spec:
      containers:
        - name: crs
          image: owasp/modsecurity-crs:4.30-nginx-202611190211
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND
              value: http://vmk8s-grafana.monitoring.svc.cluster.local:80
            - name: SERVER_NAME
              value: grafana.kind.local
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: 500m, memory: 400Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crs-grafana
  namespace: waf
spec:
  selector: {app.kubernetes.io/name: crs-grafana}
  ports:
    - {name: http, port: 80, targetPort: http}
