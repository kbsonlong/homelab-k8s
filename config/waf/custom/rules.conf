# 自定义检测规则（ID 段 1100000-1199999）
# 旁路模式下 deny 不会生效，用 log + 评分，由 vmalert 联动封禁。
#
# 示例：敏感路径探测
SecRule REQUEST_FILENAME "@rx (?i)/(\.env|\.git/config|wp-login\.php|phpmyadmin|actuator/env)$" \
  "id:1100001,phase:1,pass,log,msg:'Sensitive path probe',tag:'waf-custom',severity:'CRITICAL',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
