# 可信代理（按 X-Forwarded-For 从右往左剥离）
# 外网链路：Cloudflare → cloudflared(VM100 192.168.3.18) → Gateway Envoy → crs-detector
# Envoy 追加的是 tunnel 地址 192.168.3.18，它左边那个 IP 是 Cloudflare 写入的真实客户端 IP。
# 客户端自己伪造的 XFF 会在更左边，不会被采用。
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;       # Pod CIDR 10.42.0.0/16（访问日志的 upstream_host 已证实）以及 Cilium 内部地址
set_real_ip_from 192.168.3.83;     # Mac mini（k3s control-plane）
set_real_ip_from 192.168.3.80;     # lab-node（worker）
set_real_ip_from 192.168.3.18;     # cloudflared（Cloudflare Tunnel）
# 不要信任整个 192.168.3.0/24：LAN 客户端能伪造 XFF，把别人诬陷进封禁名单
