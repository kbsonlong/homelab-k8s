# --- 集群内 WAF: owasp/modsecurity-crs (nginx + ModSecurity + OWASP CRS v4) ---
# 架构: HTTPRoute -> crs-<app>.waf:80 -> 原始后端 svc（每上游独立实例，便于按应用放宽
# content-type / 排除误报）。安全设计: 默认 PL1, ANOMALY_INBOUND=5 / OUTBOUND=4。
# 镜像为 multi-arch (amd64+arm64, Apple Silicon 节点必需); SafeLine 无 arm64 镜像故弃用。
# 回滚: 把 3 条 HTTPRoute 的 backendRef 改回原 svc 即可, WAF 层可随时摘除。
apiVersion: v1
kind: Namespace
metadata:
  name: waf
  labels:
    app.kubernetes.io/part-of: gateway-waf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crs-grafana
  namespace: waf
  labels: {app.kubernetes.io/name: crs-grafana, app.kubernetes.io/part-of: gateway-waf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: crs-grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crs-grafana, app.kubernetes.io/part-of: gateway-waf}
    spec:
      containers:
        - name: crs
          image: owasp/modsecurity-crs:4.30-nginx-202611190211
          env:
            - name: BACKEND
              value: http://vmk8s-grafana.monitoring.svc.cluster.local:80
            - name: SERVER_NAME
              value: grafana.kbsonlong.com
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: 500m, memory: 400Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crs-grafana
  namespace: waf
  labels: {app.kubernetes.io/name: crs-grafana, app.kubernetes.io/part-of: gateway-waf}
spec:
  selector: {app.kubernetes.io/name: crs-grafana}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crs-gitea
  namespace: waf
  labels: {app.kubernetes.io/name: crs-gitea, app.kubernetes.io/part-of: gateway-waf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: crs-gitea}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crs-gitea, app.kubernetes.io/part-of: gateway-waf}
    spec:
      containers:
        - name: crs
          image: owasp/modsecurity-crs:4.30-nginx-202611190211
          env:
            - name: BACKEND
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: SERVER_NAME
              value: gitea.kbsonlong.com
            # git smart-http 的 content-type 不在 CRS 默认白名单(规则 920420), push/pull 会被拦
            - name: ALLOWED_REQUEST_CONTENT_TYPE
              value: "|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml|
                |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|
                |application/x-git-upload-pack-advertisement| |application/x-git-upload-pack-result|
                |application/x-git-receive-pack-result|"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: 500m, memory: 400Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crs-gitea
  namespace: waf
  labels: {app.kubernetes.io/name: crs-gitea, app.kubernetes.io/part-of: gateway-waf}
spec:
  selector: {app.kubernetes.io/name: crs-gitea}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crs-argocd
  namespace: waf
  labels: {app.kubernetes.io/name: crs-argocd, app.kubernetes.io/part-of: gateway-waf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: crs-argocd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crs-argocd, app.kubernetes.io/part-of: gateway-waf}
    spec:
      containers:
        - name: crs
          image: owasp/modsecurity-crs:4.30-nginx-202611190211
          env:
            - name: BACKEND
              value: http://argo-cd-argocd-server.argocd.svc.cluster.local:80
            - name: SERVER_NAME
              value: argocd.kbsonlong.com
            # ArgoCD 终端/exec 走 grpc-web, 同样不在 CRS 默认 content-type 白名单
            - name: ALLOWED_REQUEST_CONTENT_TYPE
              value: "|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml|
                |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|
                |application/grpc-web| |application/grpc-web+proto| |application/grpc-web-text| |application/grpc-web-text+proto|"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: 500m, memory: 400Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crs-argocd
  namespace: waf
  labels: {app.kubernetes.io/name: crs-argocd, app.kubernetes.io/part-of: gateway-waf}
spec:
  selector: {app.kubernetes.io/name: crs-argocd}
  ports:
    - name: http
      port: 80
      targetPort: 8080
