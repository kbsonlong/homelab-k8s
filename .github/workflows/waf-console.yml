name: waf-console
on:
  pull_request:
    paths: ["apps/waf-console/**"]
  push:
    branches: [main]
    paths: ["apps/waf-console/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/waf-console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: go mod tidy && git diff --exit-code go.mod go.sum || (echo "run go mod tidy"; exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/...
