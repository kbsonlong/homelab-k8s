name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint python3-yaml
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: YAML lint
        run: yamllint -c .yamllint.yml config helm .github
      - name: YAML parse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in list(Path('config').rglob('*.in')) + list(Path('helm').rglob('*.yaml')) + [Path('.yamllint.yml')]:
              list(yaml.safe_load_all(path.read_text()))
              print('yaml ok', path)
          PY
      - name: Secret scan
        run: |
          ! grep -RInE \
            'gitea123|-35B0|GITEA_ADMIN_PASSWORD=.+|GITEA_DB_PASSWORD=.+' \
            --exclude-dir=.git \
            --exclude-dir=rendered \
            --exclude-dir=.github \
            --exclude='.env.example' \
            .
