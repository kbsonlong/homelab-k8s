apiVersion: v1
kind: Namespace
metadata:
  name: gately
  labels:
    app.kubernetes.io/part-of: gately
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gately-config
  namespace: gately
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gately
  namespace: gately
  labels:
    app.kubernetes.io/name: gately
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gately
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gately
    spec:
      nodeSelector:
        kubernetes.io/hostname: colima
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gately
          image: ghcr.io/wangwanjie/gately:v0.5.1
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/gately
            - -listen
            - 0.0.0.0:16680
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 16680
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: GATELY_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gately-bootstrap
                  key: initial-password
          volumeMounts:
            - name: config
              mountPath: /etc/gately
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: gately-config
---
apiVersion: v1
kind: Service
metadata:
  name: gately
  namespace: gately
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gately
  ports:
    - name: http
      port: 16680
      targetPort: http
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gately-ui
  namespace: gately
  labels:
    app.kubernetes.io/part-of: gately
spec:
  parentRefs:
    - name: lab-gateway
      namespace: cilium-gateway
      sectionName: http
  hostnames:
    - gately.kbsonlong.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gately
          port: 16680
