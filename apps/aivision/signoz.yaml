apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-ob
  namespace: aivision
  labels: {app.kubernetes.io/name: signoz-ob, app.kubernetes.io/part-of: ai-vision}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: signoz-ob}}
  template:
    metadata: {labels: {app.kubernetes.io/name: signoz-ob, app.kubernetes.io/part-of: ai-vision}}
    spec:
      nodeSelector: {kubernetes.io/hostname: colima}
      containers:
        - name: signoz-ob
          image: local/signoz-ob:dev
          imagePullPolicy: IfNotPresent
          command: [/app/signoz]
          args: [server]
          env:
            - {name: SIGNOZ_TELEMETRYSTORE_PROVIDER, value: oceanbase}
            - name: SIGNOZ_TELEMETRYSTORE_OCEANBASE_DSN
              valueFrom:
                secretKeyRef:
                  name: aivision-runtime
                  key: SIGNOZ_OCEANBASE_DSN
            - {name: SIGNOZ_WEB_ENABLED, value: "false"}
            - {name: SIGNOZ_ANALYTICS_ENABLED, value: "false"}
            - {name: SIGNOZ_STATSREPORTER_ENABLED, value: "false"}
            - {name: SIGNOZ_INSTRUMENTATION_METRICS_ENABLED, value: "false"}
            - {name: SIGNOZ_USER_ROOT_ENABLED, value: "false"}
            - name: OB_TENANT_PASSWORD
              valueFrom: {secretKeyRef: {name: aivision-runtime, key: OB_TENANT_PASSWORD}}
            - name: SIGNOZ_INGEST_INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: aivision-runtime, key: SIGNOZ_INGEST_INTERNAL_KEY}}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: metastore, mountPath: /var/lib/signoz}]
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: metastore
          persistentVolumeClaim: {claimName: signoz-metastore}
