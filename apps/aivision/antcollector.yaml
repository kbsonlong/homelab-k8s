apiVersion: apps/v1
kind: Deployment
metadata:
  name: antcollector-gw
  namespace: aivision
  labels: {app.kubernetes.io/name: antcollector-gw, app.kubernetes.io/part-of: ai-vision}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: antcollector-gw}}
  template:
    metadata: {labels: {app.kubernetes.io/name: antcollector-gw, app.kubernetes.io/part-of: ai-vision}}
    spec:
      nodeSelector: {kubernetes.io/hostname: colima}
      containers:
        - name: antcollector-gw
          image: local/antcollector-gw:dev
          imagePullPolicy: IfNotPresent
          command: [/app/collector]
          args: [--config, /etc/otelcol/config.yaml]
          env:
            - name: SIGNOZ_INGEST_ENDPOINT
              value: http://signoz-ob:8080
            - name: SIGNOZ_INGEST_INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: aivision-runtime, key: SIGNOZ_INGEST_INTERNAL_KEY}}
            - name: AIVISION_INGEST_SECRET
              valueFrom: {secretKeyRef: {name: aivision-runtime, key: AIVISION_INGEST_SECRET}}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /debug/pprof/, port: health}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /debug/pprof/, port: health}
            periodSeconds: 10
            failureThreshold: 6
