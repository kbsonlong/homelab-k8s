apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aivision

resources:
  - namespace.yaml
  - storage.yaml
  - services.yaml
  - seekdb.yaml
  - signoz.yaml
  - antcollector.yaml
  - backend.yaml
  - agentlens.yaml
  - frontend.yaml
  - gateway-routes.yaml

images:
