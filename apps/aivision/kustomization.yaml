    newName: 192.168.3.83:5050/aivision-fe
    newTag: dev
  - name: local/agentlens
    newName: 192.168.3.83:5050/agentlens
    newTag: dev
  - name: local/antcollector-gw
    newName: 192.168.3.83:5050/antcollector-gw
    newTag: dev
  - name: local/signoz-ob
    newName: 192.168.3.83:5050/signoz-ob
    newTag: dev
  - name: local/seekdb
    newName: 192.168.3.83:5050/seekdb
    newTag: arm64
