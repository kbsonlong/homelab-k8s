# Grafana 七层入口: 共享 lab-gateway + HTTPRoute (集群架构约定: HTTP 走 Gateway, LB VIP 只留给真实 TCP/UDP)
# kbsonlong.com 由 scripts/render.sh 替换 (默认 kbsonlong.com); LAN 内未配 DNS, 用 curl --resolve 访问
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-ui
  namespace: monitoring
  labels:
    waf.kbsonlong.com/mirror: "true"
spec:
  parentRefs:
    - name: lab-gateway
      namespace: cilium-gateway
      sectionName: http
  hostnames:
    - grafana.kbsonlong.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # 旁路 WAF（docs/waf.md）：主链路直连后端，RequestMirror 异步复制给 waf/crs-detector
      # 回滚到串联 WAF：backendRefs 改回 crs-grafana.waf:80，并删除 RequestMirror
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: crs-detector
              namespace: waf
              port: 8080
      backendRefs:
        - name: vmk8s-grafana
          port: 80
