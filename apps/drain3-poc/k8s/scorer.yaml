apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-scorer
  namespace: anomaly-poc
spec:
  replicas: 1  # POC scorer; scores are stored in PG, no external alert delivery
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: anomaly-scorer}
  template:
    metadata:
      labels: {app: anomaly-scorer}
    spec:
      containers:
        - name: scorer
          image: drain3-sidecar:v2-poc   # 复用同一镜像,换入口
          command: ["python", "/app/scorer_v2.py", "run"]
          env:
            - name: PG_DSN
              value: host=postgres dbname=anomaly user=drain3 password=drain3poc
            - name: ALLOWED_LATENESS_SECONDS
              value: "120"
            - name: ALERT_Z
              value: "5"
