apiVersion: apps/v1
kind: Deployment
metadata:
  name: drain3-sidecar
  namespace: anomaly-poc
spec:
  replicas: 1          # POC 单写者，数据库 advisory lock 保证串行处理
  strategy:
    type: Recreate     # 滚更先停旧,杜绝双写窗口
  selector:
    matchLabels: {app: drain3-sidecar}
  template:
    metadata:
      labels: {app: drain3-sidecar}
    spec:
      containers:
      - name: sidecar
        image: drain3-sidecar:v2-poc
        imagePullPolicy: IfNotPresent
        env:
        - name: PG_DSN
          value: host=postgres dbname=anomaly user=drain3 password=drain3poc
        ports: [{containerPort: 9800}]
        readinessProbe:
          httpGet: {path: /health, port: 9800}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: drain3-sidecar
  namespace: anomaly-poc
spec:
  selector: {app: drain3-sidecar}
  ports: [{port: 9800, targetPort: 9800}]
