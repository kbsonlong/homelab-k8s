apiVersion: batch/v1
kind: Job
metadata:
  name: log-generator
  namespace: anomaly-poc
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: generator
        image: drain3-sidecar:poc       # 同镜像,换入口
        imagePullPolicy: IfNotPresent
        command: ["python", "/app/generate.py"]
        env:
        - {name: SIDECAR_URL, value: "http://drain3-sidecar:9800"}
        - {name: DURATION, value: "420"}    # 总时长 7 分钟
        - {name: ATTACK_AT, value: "200"}   # 200s 注入攻击(前 3 个整分钟桶为 calm 冷启动期)
        - {name: RATE, value: "20"}         # 基线 20 行/秒
