apiVersion: v1
kind: Namespace
metadata:
  name: anomaly-poc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: anomaly-poc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: anomaly-poc
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: anomaly}
        - {name: POSTGRES_USER, value: drain3}
        - {name: POSTGRES_PASSWORD, value: drain3poc}
        ports: [{containerPort: 5432}]
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "drain3", "-d", "anomaly"]}
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: pg-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: anomaly-poc
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
