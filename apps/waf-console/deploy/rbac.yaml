apiVersion: v1
kind: ServiceAccount
metadata: {name: waf-console}
---
# 只允许维护 waf 命名空间内的封禁路由 waf-blocklist
# （create 无法按 resourceNames 限制，所以单独一条；仅限 waf 命名空间）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: waf-console-blocker}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    resourceNames: [waf-blocklist]
    verbs: [get, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: waf-console-blocker}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: waf-console-blocker}
subjects: [{kind: ServiceAccount, name: waf-console}]
