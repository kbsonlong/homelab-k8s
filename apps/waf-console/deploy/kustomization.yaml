apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waf
resources:
  - rbac.yaml
  - waf-console.yaml
  - httproute.yaml
configMapGenerator:
  - name: waf-allowlist
    files: [allowlist.yaml]
# 镜像 tag 由 CI 更新
images:
  - name: gitea.kbsonlong.com/kbsonlong/waf-console
    newTag: latest
