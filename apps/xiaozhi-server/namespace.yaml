apiVersion: v1
kind: Namespace
metadata:
  name: xiaozhi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xiaozhi-data
  namespace: xiaozhi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xiaozhi-config
  namespace: xiaozhi
data:
  .config.yaml: |
    server:
      ip: 0.0.0.0
      port: 8000
      http_port: 8003
      websocket: ws://192.168.3.244:8000/xiaozhi/v1/
      vision_explain: http://192.168.3.244:8003/mcp/vision/explain
      timezone_offset: +8
      auth:
        enabled: false
    selected_module:
      ASR: SherpaParaformerASR
    ASR:
      SherpaParaformerASR:
        type: sherpa_onnx_local
        model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
        output_dir: tmp/
    VAD:
      SileroVAD:
        type: silero
    log:
      log_level: INFO
      log_dir: tmp
      log_file: server.log
      data_dir: data
    plugins:
      home_assistant:
        base_url: http://homeassistant.local:8123
        api_key: ""
        devices: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaozhi-server
  namespace: xiaozhi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xiaozhi-server
  template:
    metadata:
      labels:
        app: xiaozhi-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: colima
      containers:
        - name: server
          image: local/xiaozhi-server:arm64
          imagePullPolicy: Never
          ports:
            - name: websocket
              containerPort: 8000
              protocol: TCP
            - name: ota-http
              containerPort: 8003
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /
              port: websocket
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: websocket
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /opt/xiaozhi-esp32-server/data
            - name: config
              mountPath: /opt/xiaozhi-esp32-server/data/.config.yaml
              subPath: .config.yaml
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xiaozhi-data
        - name: config
          configMap:
            name: xiaozhi-config
---
apiVersion: v1
kind: Service
metadata:
  name: xiaozhi-server
  namespace: xiaozhi
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.3.244
  selector:
    app: xiaozhi-server
  ports:
    - name: websocket
      port: 8000
      targetPort: websocket
      protocol: TCP
    - name: ota-http
      port: 8003
      targetPort: ota-http
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xiaozhi-websocket
  namespace: xiaozhi
spec:
  parentRefs:
    - name: lab-gateway
      namespace: cilium-gateway
      sectionName: http
  hostnames:
    - xiaozhi.kbsonlong.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: xiaozhi-server
          port: 8003
