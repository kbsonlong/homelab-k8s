apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: waf-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.kbsonlong.com/kbsonlong/homelab-k8s.git
    targetRevision: main
    path: config/observability/waf
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
