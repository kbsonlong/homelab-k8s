apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    # values 引用: gitea 私仓 (凭据走 argocd repo secret gitea-repo-creds)
    - repoURL: https://gitea.kbsonlong.com/kbsonlong/homelab-k8s.git
      targetRevision: main
      ref: values
    # 主栈: operator(自带 CRDs) + vmsingle/vmagent/vlsingle/vlagent/vtsingle + grafana + sync-job
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.98.1
      helm:
        # 固定 release 名 vmk8s: ①组件 svc 名 <63 字符合规 ②与 apps/observability
        # 中 vtsingle-otlp-grpc-svc / grafana-httproute 的 instance 选择器一致
        releaseName: vmk8s
        valueFiles:
          - $values/helm/victoriametrics/values.yaml
    # 独立 manifest: vtsingle OTLP gRPC svc + grafana HTTPRoute (共享 lab-gateway)
    - repoURL: https://gitea.kbsonlong.com/kbsonlong/homelab-k8s.git
      targetRevision: main
      path: apps/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # HTTPRoute: API server 注入默认值 (group/kind/weight) 造成无意义漂移
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].weight
    # Job: controller 注入 selector (controller-uid) + template labels → 永久漂移
    - group: batch
      kind: Job
      jqPathExpressions:
        - .spec.selector
        - .spec.template
    # grafana secret: admin-password 由 chart randAlphaNum 每次 render 重生成;
    # Deployment 的 checksum/secret 注解随之联动 → 一并忽略 (live 值为首次安装固化值)
    - group: ""
      kind: Secret
      name: vmk8s-grafana
      jqPathExpressions:
        - .data['admin-password']
    - group: apps
      kind: Deployment
      name: vmk8s-grafana
      jqPathExpressions:
        - .spec.template.metadata.annotations
    # operator webhook cert: 每次 render 重生成 (builtin cert generator 非确定性)
    - group: ""
      kind: Secret
      name: vmk8s-victoria-metrics-operator-validation
      jqPathExpressions:
        - .data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: vmk8s-victoria-metrics-operator-admission
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
